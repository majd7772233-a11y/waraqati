name: Deploy Waraqati to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validate, build, and publish wrq.pages.dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify production artifact and relative paths
        run: node scripts/verify-dist.mjs

      # A Pages project's *.pages.dev subdomain is immutable. If the project
      # called "wrq" still owns the old wrq-bec.pages.dev hostname, rename that
      # legacy project (without deleting it) and create a genuinely new "wrq".
      - name: Ensure wrq.pages.dev is backed by a fresh Pages project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects"
          AUTH="Authorization: Bearer ${CLOUDFLARE_API_TOKEN}"
          curl -fsS -H "${AUTH}" "${API}" -o /tmp/pages-projects.json
          jq -e '.success == true and (.result | type == "array")' /tmp/pages-projects.json >/dev/null || {
            cat /tmp/pages-projects.json
            echo "Cloudflare did not return a valid Pages project list."
            exit 1
          }

          WRQ_COUNT="$(jq '[.result[] | select(.name == "wrq")] | length' /tmp/pages-projects.json)"
          if [ "${WRQ_COUNT}" -gt 1 ]; then
            echo "Cloudflare returned duplicate projects named wrq; refusing to make changes."
            exit 1
          fi

          if [ "${WRQ_COUNT}" -eq 1 ]; then
            SUBDOMAIN="$(jq -r '.result[] | select(.name == "wrq") | .subdomain // ""' /tmp/pages-projects.json)"
            echo "Existing project wrq has immutable subdomain: ${SUBDOMAIN}"
            if [ "${SUBDOMAIN}" != "wrq.pages.dev" ]; then
              # Keep the existing project and its immutable old hostname. Only
              # rename its project identifier so the desired name can be recreated.
              LEGACY_NAME="wrq-legacy-${GITHUB_RUN_ID}"
              if jq -e --arg n "${LEGACY_NAME}" '[.result[] | select(.name == $n)] | length > 0' /tmp/pages-projects.json >/dev/null; then
                echo "Legacy project name ${LEGACY_NAME} already exists; refusing to overwrite it."
                exit 1
              fi
              echo "Preserving the existing deployment; moving project identifier to ${LEGACY_NAME}."
              STATUS="$(curl -sS -o /tmp/wrq-rename.json -w '%{http_code}' \
                -X PUT "${API}/wrq" \
                -H "${AUTH}" -H "Content-Type: application/json" \
                --data "{\"name\":\"${LEGACY_NAME}\",\"production_branch\":\"main\"}")"
              if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ] || ! jq -e '.success == true and .result.name == $n' --arg n "${LEGACY_NAME}" /tmp/wrq-rename.json >/dev/null; then
                cat /tmp/wrq-rename.json
                echo "Could not safely rename the legacy project. Nothing was deleted; stopping."
                exit 1
              fi
            fi
          fi

          # Create the desired hostname only after freeing the project name.
          curl -fsS -H "${AUTH}" "${API}" -o /tmp/pages-projects-current.json
          if ! jq -e '[.result[] | select(.name == "wrq")] | length == 1' /tmp/pages-projects-current.json >/dev/null; then
            STATUS="$(curl -sS -o /tmp/wrq-create.json -w '%{http_code}' \
              -X POST "${API}" -H "${AUTH}" -H "Content-Type: application/json" \
              --data '{"name":"wrq","production_branch":"main"}')"
            if [ "${STATUS}" -lt 200 ] || [ "${STATUS}" -ge 300 ] || ! jq -e '.success == true and .result.name == "wrq" and .result.subdomain == "wrq.pages.dev"' /tmp/wrq-create.json >/dev/null; then
              cat /tmp/wrq-create.json
              echo "Could not create a fresh project with the exact wrq.pages.dev hostname."
              exit 1
            fi
          fi

          curl -fsS -H "${AUTH}" "${API}/wrq" -o /tmp/wrq-project.json
          jq -e '.success == true and .result.name == "wrq" and .result.subdomain == "wrq.pages.dev"' /tmp/wrq-project.json >/dev/null || {
            cat /tmp/wrq-project.json
            echo "Cloudflare did not confirm subdomain wrq.pages.dev; refusing to deploy."
            exit 1
          }
          echo "Confirmed exact project and immutable hostname: wrq.pages.dev"

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=wrq --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify deployment URL and stable production hostname
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Required stable production URL: https://wrq.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          echo "Deployment URL reported by Wrangler: ${DEPLOYMENT_URL:-<empty>}" >> "$GITHUB_STEP_SUMMARY"

          # The deployment-specific URL must belong to the wrq project.
          case "${DEPLOYMENT_URL:-}" in
            https://*.wrq.pages.dev|https://wrq.pages.dev)
              ;;
            *)
              echo "Wrangler deployed to an unexpected hostname: ${DEPLOYMENT_URL:-<empty>}"
              echo "Expected a deployment URL under wrq.pages.dev. The stable hostname has NOT been verified."
              exit 1
              ;;
          esac

          # Verify Cloudflare's production project details, not just the Wrangler output.
          curl -fsS \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/wrq" \
            -o /tmp/wrq-project-final.json
          jq -e '.success == true and .result.name == "wrq" and .result.subdomain == "wrq.pages.dev"' /tmp/wrq-project-final.json >/dev/null || {
            cat /tmp/wrq-project-final.json
            echo "Cloudflare API did not confirm project wrq with hostname wrq.pages.dev."
            exit 1
          }
          curl -fsS --retry 5 --retry-delay 2 "https://wrq.pages.dev/" -o /tmp/wrq-homepage.html
          grep -qi '<html' /tmp/wrq-homepage.html || {
            echo "The stable hostname did not serve HTML."
            exit 1
          }
          echo "Cloudflare API and live HTTP check confirm https://wrq.pages.dev" >> "$GITHUB_STEP_SUMMARY"
