name: Deploy Waraqati to Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Validate, build, and publish wrq.pages.dev
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript checks
        run: npm run check

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Verify production artifact and relative paths
        run: node scripts/verify-dist.mjs

      # A Pages subdomain is tied to the project created in Cloudflare.
      # Ensure the exact target exists before deploying; never deploy to wrq-bec.
      - name: Ensure the exact Cloudflare Pages project exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          API="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/wrq"
          STATUS="$(curl -sS -o /tmp/wrq-project.json -w '%{http_code}' \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            "${API}")"

          if [ "${STATUS}" = "200" ]; then
            echo "Cloudflare Pages project 'wrq' already exists."
          elif [ "${STATUS}" = "404" ]; then
            echo "Project 'wrq' is missing; creating the exact requested project."
            CREATE_STATUS="$(curl -sS -o /tmp/wrq-create.json -w '%{http_code}' \
              -X POST "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              --data '{"name":"wrq","production_branch":"main"}')"
            if [ "${CREATE_STATUS}" -lt 200 ] || [ "${CREATE_STATUS}" -ge 300 ] || ! jq -e '.success == true' /tmp/wrq-create.json >/dev/null; then
              cat /tmp/wrq-create.json
              echo "Could not create Cloudflare Pages project 'wrq'. Check the token's Pages Write permission and account ID."
              exit 1
            fi
          else
            cat /tmp/wrq-project.json
            echo "Could not verify project 'wrq' (Cloudflare API HTTP ${STATUS}); refusing to deploy to any other project."
            exit 1
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: pages deploy dist --project-name=wrq --branch=main --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the deployment URL targets wrq
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          echo "Required stable production URL: https://wrq.pages.dev" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${DEPLOYMENT_URL}" ]; then
            echo "Deployment URL reported by Wrangler: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
            case "${DEPLOYMENT_URL}" in
              https://*.wrq.pages.dev|https://wrq.pages.dev)
                ;;
              *)
                echo "Unexpected deployment URL. Expected the project hostname to end in .wrq.pages.dev; inspect the Cloudflare account and deployment details." >> "$GITHUB_STEP_SUMMARY"
                echo "Unexpected deployment URL: ${DEPLOYMENT_URL}"
                exit 1
                ;;
            esac
          else
            echo "Wrangler did not return a deployment-specific URL. Check the Cloudflare Pages project 'wrq' directly." >> "$GITHUB_STEP_SUMMARY"
          fi
