name: PWA Smoke Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa:
    name: Verify install and offline assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install locked dependencies
        run: npm install --no-audit --no-fund
      - name: Build without running tests
        run: npx vite build
      - name: Verify production artifact and PWA paths
        run: node scripts/verify-dist.mjs
